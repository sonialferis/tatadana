                  ${state.telegramTestingStatus === 'testing' ? '⏳ Testing...' : 'Test Koneksi'}
                </button>
              </div>
              <p class="text-[11px] text-slate-400">Tekan 'Test Koneksi' untuk memverifikasi getMe dan mendaftarkan webhook /api/telegram/webhook.</p>
            </div>
          </div>
        </div>`;
      }
    }

    // ---------------------------------------------------------------------------

    // ---------------------------------------------------------------------------
    // INTERACTION HANDLERS
    // ---------------------------------------------------------------------------
    function sendLandingDemoMessage() {
      const input = document.getElementById('landingChatInput');
      const val = input.value.trim();
      if (!val) return;

      state.demoChat.push({ sender: 'user', text: val });
      input.value = '';
      render();

      setTimeout(() => {
        const isInc = val.toLowerCase().includes('gajian');
        const reply = isInc
          ? `📅 Sabtu, 10 Okt 2026 — 12:40 WIB\n💰 <b>Pemasukan tercatat!</b>\n├ Nominal : <b>Rp 5.000.000</b>\n├ Kategori : 💼 Pemasukan\n├ Dompet : 👛 BCA (Default)\n└ Saldo baru : <b>Rp 19.820.000</b>\n\n💪 <i>Semangat terus! Jangan lupa sisihkan tabungan.</i>`
          : `📅 Sabtu, 10 Okt 2026 — 12:40 WIB\n💸 <b>Pengeluaran tercatat!</b>\n├ Nominal : <b>Rp 35.000</b>\n├ Kategori : 🍜 Makanan & Minuman\n├ Dompet : 👛 BCA (Default)\n├ Catatan : ${val}\n└ Saldo : <b>Rp 14.785.000</b>\n\n📊 <b>Budget Makanan bulan ini:</b>\n[███████████████░░░░] 74.0% — sisa Rp 515.000\n<i>💡 Transaksi disinkronkan ke Supabase.</i>`;
        state.demoChat.push({ sender: 'bot', text: reply });
        render();
        const chat = document.getElementById('landingChatArea');
        if (chat) chat.scrollTop = chat.scrollHeight;
      }, 350);
    }

    let currentTxType = 'expense';
    function setTxType(t) {
      currentTxType = t;
      document.getElementById('tabExpense').className = t === 'expense' ? 'py-2 bg-orange-600 text-white rounded-xl text-xs font-bold' : 'py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold';
      document.getElementById('tabIncome').className = t === 'income' ? 'py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold' : 'py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold';
      document.getElementById('tabTransfer').className = t === 'transfer' ? 'py-2 bg-blue-600 text-white rounded-xl text-xs font-bold' : 'py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold';
    }

    function handleManualTransaction(e) {
      e.preventDefault();
      const amt = parseInt(document.getElementById('txAmount').value, 10);
      const cat = document.getElementById('txCat').value;
      const notes = document.getElementById('txNotes').value || 'Pencatatan manual web';

      state.transactions.unshift({
        id: String(Date.now()),
        date: 'Baru saja, WIB',
        type: currentTxType,
        name: notes,
        category: cat,
        emoji: '📌',
        wallet: 'BCA',
        amount: amt,
        source: 'web'
      });

      if (currentTxType === 'expense') state.user.balance -= amt;
      else if (currentTxType === 'income') state.user.balance += amt;

      alert(`Sukses! Transaksi ${formatRupiah(amt)} berhasil dicatat.`);
      navigate('dashboard', 'laporan');
    }

    function toggleReceiptExpand(id) {
      state.expandedReceiptId = state.expandedReceiptId === id ? null : id;
      render();
    }

    function setDefaultWallet(id) {
      state.wallets.forEach(w => w.isDefault = (w.id === id));
      render();
    }

    function testBotConnection() {
      state.telegramTestingStatus = 'testing';
      state.botStatusMsg = '⏳ Testing getMe & setWebhook...';
      render();

      setTimeout(() => {
        state.telegramTestingStatus = 'connected';
        state.botStatusMsg = '🟢 Terhubung (@TataDana_bot) — Webhook aktif';
        alert('Koneksi Sukses: Bot @TataDana_bot terverifikasi dan webhook berhasil didaftarkan ke https://tatadana.app/api/telegram/webhook');
        render();
      }, 700);
    }

    function downloadReport(format) {
      const fileName = `TataDana_Laporan_Okt2026.${format}`;
      alert(`Membuat dan mengunduh file ${fileName} dari Supabase Storage signed URL...`);
      const element = document.createElement('a');
      element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent('TataDana Executive Financial Report: Generated on-demand. Total Saldo: Rp 14.820.000'));
      element.setAttribute('download', fileName);
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    }

    // Initial render
    render();
  </script>
</body>
</html>
